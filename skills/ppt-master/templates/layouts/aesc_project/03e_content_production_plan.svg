<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1280" height="6" fill="#3B3B44"/>
  <text x="1162" y="24" font-family="Calibri, sans-serif" font-size="13" fill="#000000">AESC CONFIDENTIAL</text>
  <text x="33" y="65" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="bold" fill="#000000">{{PAGE_TITLE}}</text>
  <line x1="20" y1="79.8" x2="1262" y2="79.8" stroke="#3B3B44" stroke-width="1"/>

  <!-- Production Plan Table Container -->
  <g id="production-table" transform="translate(33, 95)">
    <!-- Summary Header -->
    <rect x="0" y="0" width="1214" height="32" fill="#3C3A45"/>
    <text x="16" y="22" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">PRODUCTION &amp; SHIPMENT BATCH SCHEDULE</text>
    <text x="1198" y="22" text-anchor="end" font-family="Calibri, sans-serif" font-size="13" fill="#CBD5E1">{{PLAN_SUMMARY}}</text>

    <!-- Table Header -->
    <g id="prod-header" transform="translate(0, 32)">
      <rect x="0" y="0" width="220" height="28" fill="#44546A"/>
      <text x="20" y="19" font-family="Calibri, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">BATCH / WORK PACKAGE</text>

      <rect x="220" y="0" width="200" height="28" fill="#5B9BD5" stroke="#FFFFFF" stroke-width="1"/>
      <text x="320" y="19" text-anchor="middle" font-family="Calibri, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">QUANTITY / CAPACITY</text>

      <rect x="420" y="0" width="280" height="28" fill="#41719C" stroke="#FFFFFF" stroke-width="1"/>
      <text x="560" y="19" text-anchor="middle" font-family="Calibri, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">PLANNED PRODUCTION &amp; FAT</text>

      <rect x="700" y="0" width="280" height="28" fill="#3B3B44" stroke="#FFFFFF" stroke-width="1"/>
      <text x="840" y="19" text-anchor="middle" font-family="Calibri, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">EXPECTED ETD / ARRIVAL</text>

      <rect x="980" y="0" width="234" height="28" fill="#44546A" stroke="#FFFFFF" stroke-width="1"/>
      <text x="1097" y="19" text-anchor="middle" font-family="Calibri, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">STATUS</text>
    </g>

    <!-- Rows -->
    <g id="prod-rows" transform="translate(0, 60)">
      <!-- Batch 1 -->
      <rect x="0" y="0" width="220" height="42" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
      <text x="20" y="26" font-family="Calibri, sans-serif" font-size="13" font-weight="bold" fill="#1E293B">{{BATCH_1_NAME}}</text>
      <rect x="220" y="0" width="200" height="42" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      <text x="320" y="26" text-anchor="middle" font-family="Calibri, sans-serif" font-size="13" fill="#334155">{{BATCH_1_QTY}}</text>
      <rect x="420" y="0" width="280" height="42" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      <text x="560" y="26" text-anchor="middle" font-family="Calibri, sans-serif" font-size="13" fill="#334155">{{BATCH_1_DATE}}</text>
      <rect x="700" y="0" width="280" height="42" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      <text x="840" y="26" text-anchor="middle" font-family="Calibri, sans-serif" font-size="13" fill="#334155">Port of Long Beach / AZ Site</text>
      <rect x="980" y="0" width="234" height="42" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      <text x="1097" y="26" text-anchor="middle" font-family="Calibri, sans-serif" font-size="13" font-weight="bold" fill="#00B050">{{BATCH_1_STATUS}}</text>

      <!-- Batch 2 -->
      <rect x="0" y="42" width="220" height="42" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
      <text x="20" y="68" font-family="Calibri, sans-serif" font-size="13" font-weight="bold" fill="#1E293B">{{BATCH_2_NAME}}</text>
      <rect x="220" y="42" width="200" height="42" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      <text x="320" y="68" text-anchor="middle" font-family="Calibri, sans-serif" font-size="13" fill="#334155">{{BATCH_2_QTY}}</text>
      <rect x="420" y="42" width="280" height="42" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      <text x="560" y="68" text-anchor="middle" font-family="Calibri, sans-serif" font-size="13" fill="#334155">{{BATCH_2_DATE}}</text>
      <rect x="700" y="42" width="280" height="42" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      <text x="840" y="68" text-anchor="middle" font-family="Calibri, sans-serif" font-size="13" fill="#334155">Port of Long Beach / AZ Site</text>
      <rect x="980" y="42" width="234" height="42" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      <text x="1097" y="68" text-anchor="middle" font-family="Calibri, sans-serif" font-size="13" font-weight="bold" fill="#4472C4">{{BATCH_2_STATUS}}</text>
    </g>
  </g>

  <!-- Footer -->
  <rect x="0" y="656" width="1280" height="64" fill="#3B3B44"/>
  <image href="assets/logo_aesc_white.png" x="12" y="660" width="150" height="54" preserveAspectRatio="xMidYMid meet"/>
  <text x="180" y="678" font-family="Calibri, sans-serif" font-size="11" fill="#F2F2F2" font-style="italic">
    <tspan x="180" dy="0">Without AESC’s explicit authorization, any recording of photos, screen captures, videos or other form of data collection for the purpose of reproducing</tspan>
    <tspan x="180" dy="14">or disseminating information contained in this document is strictly prohibited, and AESC reserves the right to pursue violations of its information security</tspan>
    <tspan x="180" dy="14">policy to the fullest extent permitted by law.</tspan>
  </text>
  <text x="1240" y="700" text-anchor="end" font-family="Calibri, sans-serif" font-size="14" fill="#FFFFFF">{{PAGE_NUM}}</text>
</svg>
