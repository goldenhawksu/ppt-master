<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <image href="assets/cover_bg.jpeg" x="0" y="0" width="1280" height="720" preserveAspectRatio="none"/>
  <rect x="0" y="0" width="1280" height="720" fill="#385723" fill-opacity="0.4"/>
  <rect x="0" y="0" width="1280" height="6" fill="#3B3B44"/>
  <text x="1162" y="24" font-family="Calibri, sans-serif" font-size="13" fill="#FFFFFF" font-weight="bold">AESC CONFIDENTIAL</text>

  <g id="cover-header" transform="translate(100, 260)">
    <image href="assets/logo_aesc_white.png" x="0" y="10" width="184" height="66" preserveAspectRatio="xMidYMid meet"/>
    <line x1="210" y1="0" x2="210" y2="160" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.8"/>

    <!-- Title and Subtitle -->
    <text x="240" y="48" font-family="Helvetica, Arial, sans-serif" font-size="44" font-weight="bold" fill="#FFFFFF">{{TITLE}}</text>
    <text x="240" y="100" font-family="Calibri, Arial, sans-serif" font-size="24" fill="#E2E8F0">{{SUBTITLE}}</text>
    <text x="240" y="145" font-family="Calibri, Arial, sans-serif" font-size="18" fill="#CBD5E1">{{DATE}} | {{AUTHOR}}</text>
  </g>
</svg>
