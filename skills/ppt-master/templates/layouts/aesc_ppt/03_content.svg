<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">

  <!-- White background -->
  <rect width="1280" height="720" fill="#FFFFFF"/>

  <!-- Standard 4-zone header -->
  <rect x="0" y="0" width="1280" height="38" fill="#FFFFFF"/>
  <text x="24" y="24" fill="#1A1818" font-family="Arial, Helvetica Neue, Microsoft YaHei, PingFang SC, sans-serif" font-size="16" font-weight="700" letter-spacing="2">{{BRAND_LABEL}}</text>
  <line x1="320" y1="10" x2="320" y2="28" stroke="#DDDDDD" stroke-width="1"/>
  <text x="480" y="24" text-anchor="middle" fill="#9B9B9B" font-family="Arial, sans-serif" font-size="13">aesc-group.com</text>
  <line x1="640" y1="10" x2="640" y2="28" stroke="#DDDDDD" stroke-width="1"/>
  <text x="880" y="24" text-anchor="middle" fill="#9B9B9B" font-family="Arial, sans-serif" font-size="13">document level : confidential</text>
  <line x1="1120" y1="10" x2="1120" y2="28" stroke="#DDDDDD" stroke-width="1"/>
  <text x="1200" y="24" text-anchor="middle" fill="#9B9B9B" font-family="Arial, sans-serif" font-size="13">{{PAGE_NUM}}</text>
  <line x1="0" y1="38" x2="1280" y2="38" stroke="#DDDDDD" stroke-width="1"/>

  <!-- Left blue accent bar -->
  <rect x="44" y="55" width="4" height="38" fill="#2563EB"/>

  <!-- Page title -->
  <text x="56" y="84" fill="#1A1818" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="32" font-weight="700">{{PAGE_TITLE}}</text>

  <!-- Title underline -->
  <line x1="56" y1="98" x2="256" y2="98" stroke="#2563EB" stroke-width="2"/>

  <!-- Key message -->
  <text x="56" y="126" fill="#374151" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="18">{{KEY_MESSAGE}}</text>

  <!-- Separator -->
  <line x1="56" y1="146" x2="1224" y2="146" stroke="#EEEEEE" stroke-width="1"/>

  <!-- Flexible content area placeholder -->
  <!--
      AI Flexible Layout Zone
      Available space: x=56, y=154, w=1168, h=502

      Recommended layouts:
      - Left-right columns (560+560, gap=24)
      - Top-bottom split
      - 2×2 matrix (560×240 each, gap=20)
      - 3-column cards (376×480, gap=24)
      - Data card cluster (280×150 each)
      - Horizontal flow (full width, 120-140px height, 3-6 nodes)
      - Dashboard: KPI row (top 100px) + chart area (below)
      - Dense table: full width, max 400px height

      Common elements:
      Data card: <rect fill="#FFFFFF" stroke="#EEEEEE" stroke-width="1" rx="4"/>
                 <rect width="4" fill="#2563EB"/> (left accent)
      Key metric: <text fill="#2563EB" font-size="44" font-weight="700"/>
      Positive:   <text fill="#00C87A"/>
      Comparison: <text fill="#2563EB"/> vs <text fill="#374151"/>
      Divider:    <line stroke="#EEEEEE"/>
  -->
  <text x="640" y="420" text-anchor="middle" fill="#DDDDDD" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="3">{{CONTENT_AREA}}</text>
  <text x="640" y="456" text-anchor="middle" fill="#EEEEEE" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="14">Content Area: 1168 × 502 px</text>

  <!-- Footer -->
  <text x="56" y="700" fill="#9B9B9B" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="12">{{SOURCE}}</text>

</svg>
