<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">

  <!-- Ending background image (dark + AESC watermark) -->
  <image href="end.jpg" x="0" y="0" width="1280" height="720" preserveAspectRatio="xMidYMid slice"/>

  <!-- "Thanks" text -->
  <text x="640" y="252" text-anchor="middle" fill="#DEDEDE" font-family="Arial, &quot;Helvetica Neue&quot;, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="36" font-weight="300" letter-spacing="6">{{THANK_YOU}}</text>

  <!-- Brand label at bottom -->
  <text x="640" y="636" text-anchor="middle" fill="#FFFFFF" font-family="Arial, &quot;Helvetica Neue&quot;, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="20" font-weight="700" letter-spacing="2">{{BRAND_LABEL}}</text>

  <!-- Optional contact info -->
  <text x="640" y="666" text-anchor="middle" fill="#888888" font-family="Arial, &quot;Helvetica Neue&quot;, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="14">{{CONTACT_INFO}}</text>

  <!-- Date -->
  <text x="640" y="696" text-anchor="middle" fill="#888888" font-family="Arial, sans-serif" font-size="12">{{DATE}}</text>

</svg>
