<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="720" viewBox="0 0 1280 720">

  <!-- White top brand strip -->
  <rect x="0" y="0" width="1280" height="44" fill="#FFFFFF"/>
  <text x="24" y="28" fill="#1A1818" font-family="Arial, Helvetica Neue, sans-serif" font-size="16" font-weight="700">{{BRAND_LABEL}}</text>
  <line x1="0" y1="44" x2="1280" y2="44" stroke="#EEEEEE" stroke-width="1"/>

  <!-- Cover background image -->
  <image href="cover.jpg" x="0" y="44" width="1280" height="534" preserveAspectRatio="xMidYMid slice"/>

  <!-- Dark left gradient for title readability -->
  <defs>
    <linearGradient id="titleFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="44" width="700" height="534" fill="url(#titleFade)"/>

  <!-- Title over image -->
  <text x="60" y="180" fill="#FFFFFF" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="56" font-weight="700">{{TITLE}}</text>
  <text x="60" y="270" fill="#FFFFFF" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="24" font-weight="400">{{SUBTITLE}}</text>

  <!-- White bottom info strip -->
  <rect x="0" y="578" width="1280" height="142" fill="#FFFFFF"/>
  <text x="56" y="636" fill="#1A1818" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="28" font-weight="700">{{AUTHOR}}</text>
  <text x="56" y="672" fill="#3A3838" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16">{{DATE}}</text>

</svg>
